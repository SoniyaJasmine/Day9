<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Libertinus+Math&family=Lobster&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Food Blog/write.css">
    <title>Document</title>
</head>
<body>
    <section class="write-section" id="write">
        <nav class="navbar">
            <div class="logo">
                <img src="../Food Blog/ChatGPT Image Feb 27, 2026, 04_43_13 PM.png" alt="Logo" class="logo">
            </div>
            <div class="search-bar">
                <span>⌕</span>
                <input type="text" placeholder="Search here...">
            </div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Blogs</a></li>
                <li><a href="#">Recipes</a></li>
                <li><a href="#write" id="writelink">Write</a></li>
            </ul>
            <div class="nav-right">
                <a href="#" class="account">Account</a>
                <a href="#" class="subscribe">Subscribe</a>
            </div>
        </nav>
        <div class="login-flex">
            <div class="login-card">
                <h2>"Welcome Back, Food Lover!"</h2>
                <p class="login-subtitle">Discover, cook, and share delicious recipes.</p>
                <h3>Login to Your Account</h3>
                <form action="">
                    <label for="username">User Name/ Email Id</label>
                    <input type="text" name="" id="username" placeholder="Enter User name or Email Id" required>
                    <label for="password">Password</label>
                    <div class="password-box">
                        <input type="password" name="" id="password" placeholder="Enter Password" required>
                        <span id="togglePassword">◉</span>
                    </div>
                    <div class="forget">
                        <a href="#">Forget Password?</a>
                    </div>
                    <button type="submit" class="login-btn"><a href="login.html">Login</a></button>
                    <p  class="register-text">
                        Don’t have an account?
                        <a href="register.html">Register</a>
                    </p>
                    <hr>
                    <p class="quick-login">Quick Login</p>
                    <button type="submit" class="google-btn">Continue With Google <span>G</span></button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
