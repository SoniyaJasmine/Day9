<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../Portfolio/contact.css">
</head>
<body>
    <section class="contact-page">

        <!-- Heading -->

        <div class="contact-title">

            <h1>Contact Me</h1>

        </div>


        <!-- Contact Content -->

        <div class="contact-container">


            <!-- Contact Information -->

            <div class="contact-info">

                <h2>Let's talk.</h2>

                <p>
                    I'm always open to learning, collaborating
                    and exploring new opportunities in web
                    development.
                </p>


                <div class="contact-detail">

                    <span>Email</span>

                    <a href="mailto:yourname@gmail.com">
                        sonysophia07@gmail.com
                    </a>

                </div>


                <div class="contact-detail">

                    <span>Location</span>

                    <p>Tamil Nadu, India</p>

                </div>


                <div class="contact-detail">

                    <span>Follow me</span>

                    <div class="contact-socials">

                        <a href="#" aria-label="LinkedIn">
                            <img src="../Portfolio/mingcute--linkedin-fill.svg" alt="LinkedIn">
                        </a>

                        <a href="#" aria-label="GitHub">
                            <img src="../Portfolio/ri--github-fill.svg" alt="GitHub">
                        </a>

                    </div>

                </div>

            </div>


            <!-- Contact Form -->

            <div class="contact-form">

                <form>

                    <div class="input-group">

                        <label for="name">Your Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <div class="input-group">

                        <label for="email">Your Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="input-group">

                        <label for="message">Message</label>

                        <textarea
                            id="message"
                            rows="5"
                            placeholder="Write your message..."
                            required></textarea>

                    </div>


                    <button type="submit">
                        Send Message →
                    </button>

                </form>

            </div>

        </div>


        <div class="contact-back">

            <a href="portfolio.html">
                Back to Home
            </a>

        </div>

    </section>
</body>
</html>
