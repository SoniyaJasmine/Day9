<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box
        }
        h3{
            text-align: center;
        }
        .container{
            /* width: ; */
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            width: 800px;
            height: 500px;
            background-image: url(https://images.pexels.com/photos/27547853/pexels-photo-27547853.jpeg?cs=srgb&dl=pexels-diva-27547853.jpg&fm=jpg );
            background-size: cover;
            padding-top: 100px;
        }
        #login{
            width: 300px;
            height: 250px;
            background-color: white;
            border-radius: 5%;
            padding: 10px;
            text-align: center;
        }
        #signup{
            width: 300px;
            height: 250px;
            background-color: white;
            border-radius: 5%;
            padding: 10px;
            text-align: center;
        }
        input{
            padding: 5px;
            border-radius: 5px;
        }
        input:focus{
            color: blue;
        }
    </style>
</head>
<body>
    <h1>6</h1>
    <h3>Stylish login & Signup Forms</h3>
    <div class="container">
    <form action="" id="login">
        <header>Login Form</header><br>
        <input type="email" name="" id="" placeholder="Email Address"><br><br>
        <input type="password" name="" id="" placeholder="Password">
        <p><a href="">Forgot Password?</a></p>
        <button>Login</button>
        <p>Not a memeber? <a href="">Signup now</a></p>
    </form>
    <form action="" id="signup">
        <header>Signup Form</header><br>
        <input type="email" name="" id="" placeholder="Email Address"><br><br>
        <input type="password" name="" id="" placeholder="Password"><br><br>
        <input type="password" name="" id="" placeholder="Confirm password"><br><br>
        <button>Signup</button>
    </form>
    </div>
</body>
</html>
