<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>1. Weather App</h1>
    <div>
        <input type="text" name="" id="city" placeholder="Enter City name">
        <button id="searchBtn">Search</button>
        <div id="weather"></div>
    </div>
    <br><br>
    <hr>

    <h1>2. Todo List</h1>
    <input type="text" name="" id="todoInput" placeholder="Enter a task">
    <button id="addBtn">Add Task</button>
    <p id="message"></p>
    <ul id="todoList"></ul>
    <br><br>
    <hr>

    <h1>3. Autocompleter Search</h1>
    <input type="text" name="" id="searchInput" placeholder="Search user...">
    <div id="results"></div>
    <p id="content"></p>


    <script>

        // Weather App

        const cityInput = document.getElementById("city");
        const searchBtn = document.getElementById("searchBtn");
        const weather = document.getElementById("weather");

        searchBtn.addEventListener("click", getWeather);

        async function getWeather() {
            const city = cityInput.value.trim();
            if (city === ""){
                weatherk.innerHTML = 
                    <p class="error">Please enter a City name.</p>;
                return;
            }
            weather.innerHTML = "Loading...";
            try {
                const locationResponse = await locationResponse.json();
                if (!locationData.results) {
                    throw new Error("City not found");
                }
                const latitude = locationData.results[0].latitude;
                const longitude = locationData.results[0].longitude;
                const cityName = locationData.results[0].name;

                const weatherResponse = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`
                );

                const weatherData = await weatherResponse.json();

                weather.innerHTML = `
                    <h3>${cityName}</h3> 
                    <p>🌡️ Temperature: ${weatherData.current.temperature_2m}°C </p> 
                    <p>💧 Humidity: ${weatherData.current.relative_humidity_2m}% </p> 
                    <p>💨 Wind Speed: ${weatherData.current.wind_speed_10m} km/h </p> 
                    `;
            }
            catch (error) {
                weather.innerHTML = `
                    <p class="error"> Unable to get weather data. </p> `;
                    console.log(error);
            }
        }

        // Todo List

        const todoInput = document.getElementById("todoInput");
        const addBtn = document.getElementById("addBtn");
        const todoList = document.getElementById("todoList");
        const message = document.getElementById("message");

        const API_URL = "https://jsonplaceholder.typicode.com/todos";

        loadTodos();

        addBtn.addEventListener("click", addTodo);

        async function loadTodos() {
            message.textContent = "Loading...";
            message.className = "loading";

            try {
                const response = await fetch(
                    `${API_URL}?_limit=5`
                );
                if (!response.ok) {
                    throw new Error("Failed to fetch todos");
                }
                const todos = await response.json();
                todoList.innerHTML = "";
                todos.forEach(todo => {
                    displayTodo(todo);
                });
            }
            catch (error) {
                message.textContent = "Error loading todos.";
                message.className = "error";
                console.log(error);
            }
        }
        async function addTodo() { 
            const task = todoInput.value.trim(); 
            if (task === "") {
                 message.textContent = "Please enter a task."; 
                 message.className = "error"; 
                 return; 
            } 
            message.textContent = "Adding task..."; 
            message.className = "loading"; 
            try { 
                const response = await fetch(API_URL, { 
                    method: "POST", 
                    headers: { "Content-Type": "application/json" }, 
                    body: JSON.stringify({ title: task, completed: false }) 
            }); 
            if (!response.ok) { 
                throw new Error("Failed to add todo"); 
            } 
            const newTodo = await response.json(); 
            displayTodo(newTodo); 
            todoInput.value = ""; 
            message.textContent = "Task added successfully!"; 
            message.className = ""; 
        } 
        catch (error) { 
            message.textContent = "Error adding task."; 
            message.className = "error"; 
            console.log(error); 
        } 
    } 
    function displayTodo(todo) {
         const li = document.createElement("li"); 
         li.textContent = todo.title;
          todoList.appendChild(li); 
        }


    // Autocomplete Search

    const searchInput = document.getElementById("searchInput");
    const results = document.getElementById("results");
    const content = document.getElementById("content");

    let debounceTimer;

    searchInput.addEventListener("input", () => {
        const searchText = searchInput.value.trim();
        clearTimeout(debounceTimer);
        results.innerHTML = "";
        content.textContent = "";
        if (searchText === "") {
            return;
        }
        debounceTimer = setTimeout(() => {
            searchUsers(searchText);
        }, 500);
    });
    async function searchUsers(searchText) {
        content.textContent = "Loading...";
        content.className = "loading";

        try {
            const response = await fetch( "https://jsonplaceholder.typicode.com/users" );
        }
        if (!response.ok) {
            throw new Error("Failed to fetch users");
        }
        const users = await response.json();

        const filteredUsers = users.filter(user =>
            user.name 
            .toLowerCase() 
            .includes(searchText.toLowerCase())
        );
        results.innerHTML = "";
        if (filteredUsers.length === 0) {
            content.textContent = "No users found.";
            return;
        }
        filteredUsers.forEach(user => {
            const div = document.createElement("div");
            div.className = "result";
            div.textContent = user.name;
            results.appendChild(div);
        });
        content.textContent = "";
    }
    catch (error) {
        content.textContent = "Something went wrong.";
        content.className = "error";
        console.log(error);
    }
}
    </script>
</body>
</html>
